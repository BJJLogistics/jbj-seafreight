<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JBJ Sea Freight</title>

  <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #071521;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .top-panel {
      position: absolute;
      z-index: 5;
      top: 16px;
      left: 16px;
      padding: 13px 17px;
      border: 1px solid rgba(100, 210, 255, .35);
      border-radius: 10px;
      color: white;
      background: rgba(5, 20, 34, .88);
      box-shadow: 0 0 18px rgba(0, 180, 255, .15);
    }

    .top-panel strong {
      display: block;
      font-size: 17px;
      letter-spacing: 1px;
    }

    .top-panel span {
      display: block;
      margin-top: 5px;
      color: #9ddcff;
      font-size: 12px;
    }

    .info {
      position: absolute;
      z-index: 5;
      bottom: 18px;
      left: 16px;
      max-width: calc(100% - 32px);
      padding: 11px 15px;
      color: white;
      background: rgba(5, 20, 34, .9);
      border: 1px solid rgba(100, 210, 255, .35);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .jbj-marker {
      width: 32px;
      height: 32px;
      border: 2px solid #00d9ff;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 10px #00cfff, 0 0 22px rgba(0, 207, 255, .75);
      background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #ffffff 33.33%,
        #00966e 33.33%,
        #00966e 66.66%,
        #d62612 66.66%,
        #d62612 100%
      );
    }

    .jbj-marker::after {
      content: "JBJ";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 2px 3px;
      border-radius: 2px;
      background: rgba(0, 0, 0, .85);
      color: white;
      font-size: 8px;
      font-weight: bold;
      letter-spacing: .3px;
      line-height: 1;
    }

    .port-label {
      color: white;
      font-size: 11px;
      font-weight: bold;
      text-shadow:
        0 1px 3px #000,
        1px 0 3px #000,
        0 -1px 3px #000,
        -1px 0 3px #000;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .top-panel { top: 10px; left: 10px; }
      .info { bottom: 10px; left: 10px; }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div class="top-panel">
    <strong>JBJ SEA FREIGHT</strong>
    <span>Worldwide Container Shipping</span>
  </div>

  <div class="info" id="info">
    Connecting to the world map...
  </div>

  <script>
    const rotterdam = {
      name: "Rotterdam",
      coordinates: [4.4777, 51.9244]
    };

    const ports = [
      { name: "Shanghai", coordinates: [121.4737, 31.2304] },
      { name: "Singapore", coordinates: [103.8198, 1.3521] },
      { name: "Ningbo-Zhoushan", coordinates: [121.5440, 29.8683] },
      { name: "Shenzhen", coordinates: [114.0579, 22.5431] },
      { name: "Qingdao", coordinates: [120.3826, 36.0671] },
      { name: "Busan", coordinates: [129.0756, 35.1796] },
      { name: "Hong Kong", coordinates: [114.1694, 22.3193] },
      { name: "Port Klang", coordinates: [101.3920, 3.0000] },
      { name: "Jebel Ali", coordinates: [55.0273, 24.9857] },
      { name: "Los Angeles", coordinates: [-118.2437, 34.0522] },
      { name: "Long Beach", coordinates: [-118.1937, 33.7701] },
      { name: "New York", coordinates: [-74.0060, 40.7128] },
      { name: "Vancouver", coordinates: [-123.1207, 49.2827] },
      { name: "Santos", coordinates: [-46.3289, -23.9608] },
      { name: "Cartagena", coordinates: [-75.5144, 10.3910] },
      { name: "Callao", coordinates: [-77.1181, -12.0566] },
      { name: "Melbourne", coordinates: [144.9631, -37.8136] },
      { name: "Sydney", coordinates: [151.2093, -33.8688] },
      { name: "Durban", coordinates: [31.0218, -29.8587] },
      { name: "Tanger Med", coordinates: [-5.5070, 35.8800] }
    ];

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/fiord",
      center: [10, 20],
      zoom: 1.5,
      minZoom: 1,
      maxZoom: 8,
      attributionControl: true
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");

    const info = document.getElementById("info");

    function setStatus(message) {
      info.textContent = message;
    }

    // Great-circle interpolation: calculates a position between two ports.
    function greatCirclePoint(start, end, fraction) {
      const toRadians = value => value * Math.PI / 180;
      const toDegrees = value => value * 180 / Math.PI;

      const lon1 = toRadians(start[0]);
      const lat1 = toRadians(start[1]);
      const lon2 = toRadians(end[0]);
      const lat2 = toRadians(end[1]);

      const a = [
        Math.cos(lat1) * Math.cos(lon1),
        Math.cos(lat1) * Math.sin(lon1),
        Math.sin(lat1)
      ];

      const b = [
        Math.cos(lat2) * Math.cos(lon2),
        Math.cos(lat2) * Math.sin(lon2),
        Math.sin(lat2)
      ];

      const dot = Math.max(-1, Math.min(1,
        a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
      ));

      const angle = Math.acos(dot);

      if (angle < 0.000001) {
        return [
          start[0] + (end[0] - start[0]) * fraction,
          start[1] + (end[1] - start[1]) * fraction
        ];
      }

      const sinAngle = Math.sin(angle);
      const weightA = Math.sin((1 - fraction) * angle) / sinAngle;
      const weightB = Math.sin(fraction * angle) / sinAngle;

      const x = weightA * a[0] + weightB * b[0];
      const y = weightA * a[1] + weightB * b[1];
      const z = weightA * a[2] + weightB * b[2];

      return [
        toDegrees(Math.atan2(y, x)),
        toDegrees(Math.atan2(z, Math.sqrt(x * x + y * y)))
      ];
    }

    // Animate the marker from its current port to the next port.
    function animateMarker(marker, start, end, duration) {
      return new Promise(resolve => {
        const startTime = performance.now();

        function frame(now) {
          const progress = Math.min(1, (now - startTime) / duration);

          // Smooth movement while keeping the full journey duration.
          const eased = progress;

          const position = greatCirclePoint(start, end, eased);
          marker.setLngLat(position);

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            marker.setLngLat(end);
            resolve();
          }
        }

        // Set the starting position before the animation begins.
        marker.setLngLat(start);
        requestAnimationFrame(frame);
      });
    }

    function wait(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    function addPortMarkers() {
      ports.forEach(port => {
        new maplibregl.Marker({ color: "#00bfff" })
          .setLngLat(port.coordinates)
          .addTo(map);

        const label = document.createElement("div");
        label.className = "port-label";
        label.textContent = port.name;

        new maplibregl.Marker({
          element: label,
          anchor: "left",
          offset: [7, 0]
        })
          .setLngLat(port.coordinates)
          .addTo(map);
      });

      new maplibregl.Marker({ color: "#00e5ff" })
        .setLngLat(rotterdam.coordinates)
        .addTo(map);
    }

    function addShippingRoutes() {
      const features = ports.map(port => ({
        type: "Feature",
        properties: { name: port.name },
        geometry: {
          type: "LineString",
          coordinates: Array.from({ length: 81 }, (_, index) =>
            greatCirclePoint(
              rotterdam.coordinates,
              port.coordinates,
              index / 80
            )
          )
        }
      }));

      map.addSource("shipping-routes", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features
        }
      });

      map.addLayer({
        id: "shipping-routes-glow",
        type: "line",
        source: "shipping-routes",
        paint: {
          "line-color": "#00aaff",
          "line-width": 3,
          "line-opacity": 0.22,
          "line-blur": 3
        }
      });

      map.addLayer({
        id: "shipping-routes-line",
        type: "line",
        source: "shipping-routes",
        paint: {
          "line-color": "#26c9ff",
          "line-width": 1.3,
          "line-opacity": 0.65,
          "line-dasharray": [2, 2]
        }
      });
    }

    async function startVoyages(marker) {
      let previousIndex = -1;

      while (true) {
        // Choose a different destination each time.
        let index;

        do {
          index = Math.floor(Math.random() * ports.length);
        } while (index === previousIndex && ports.length > 1);

        previousIndex = index;

        const destination = ports[index];
        const destinationCoordinates = destination.coordinates;

        // Outbound journey.
        setStatus("Outbound to " + destination.name);

        await animateMarker(
          marker,
          rotterdam.coordinates,
          destinationCoordinates,
          8000
        );

        // Brief stop at the destination.
        marker.setLngLat(destinationCoordinates);
        setStatus("Arrived at " + destination.name);
        await wait(1000);

        // Return journey: explicitly animate from destination to Rotterdam.
        setStatus("Returning to Rotterdam");

        await animateMarker(
          marker,
          destinationCoordinates,
          rotterdam.coordinates,
          8000
        );

        // Make sure the marker is exactly at the home port.
        marker.setLngLat(rotterdam.coordinates);

        setStatus("Back in Rotterdam — preparing next voyage");
        await wait(1000);
      }
    }

    map.on("load", () => {
      try {
        addShippingRoutes();
        addPortMarkers();

        const markerElement = document.createElement("div");
        markerElement.className = "jbj-marker";

        const shipMarker = new maplibregl.Marker({
          element: markerElement,
          anchor: "center"
        })
          .setLngLat(rotterdam.coordinates)
          .addTo(map);

        setStatus("JBJ Sea Freight — ready to depart from Rotterdam");

        startVoyages(shipMarker).catch(error => {
          console.error("Voyage animation error:", error);
          setStatus("Animation error: " + error.message);
        });

      } catch (error) {
        console.error(error);
        setStatus("Map error: " + error.message);
      }
    });

    map.on("error", event => {
      console.error("MapLibre error:", event.error);
    });
  </script>
</body>
</html>
